  <script>
    // Defensive guard against scripts attempting to assign window.fetch in strict mode
    // when window.fetch only has a getter in sandboxed iframe environments
    try {
      const currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
      let activeFetch = currentFetch;
      Object.defineProperty(window, 'fetch', {
        get() {
          return activeFetch;
        },
        set(newFetch) {
          activeFetch = newFetch;
        },
        configurable: true,
        enumerable: true,
      });
    } catch (err) {
      // Safe fallback
    }
  </script>
